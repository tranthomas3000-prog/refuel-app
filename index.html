<!DOCTYPE html>
<html>
<body>

<h1>REFUEL & REJUVENATE</h1>

<p>At the right time.</p>

<button onclick="startCamera()">
CHECK ME
</button>

<h2>PLACE YOUR FINGER ON CAMERA</h2>

<p>Hold still for 30 seconds</p>
<video id="camera" autoplay playsinline></video>
    <p id="camera-status"></p>

<p>Reading your signal...</p>
    <p id="timer"></p>
<script>
    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const track = stream.getVideoTracks()[0];
       // await track.applyConstraints({ advanced: [{ torch: true }] });
        setInterval(() => track.applyConstraints({ advanced: [{ torch: true }] }), 1000);
        document.getElementById("camera").srcObject = stream;
        let timeLeft=30;
        document.getElementById("timer").textContent = timeLeft;
        const countdown = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").textContent = timeLeft;
            if (timeLeft<= 0) {
              clearInterval(countdown);
            }, 1000);
        await document.getElementById("camera").play();
        await track.applyConstraints({ advanced: [{ torch: true }] });
        setTimeout(() => {
            alert("30 SECOND READING COMPLETE");
            stream.getTracks().forEach(track => track.stop());
        }, 31000);
        console.log("CAMERA STARTED")
        //START RECORDING
        let recorder;
        let recordedChunks=[];
        recorder = new MediaRecorder(stream);
        recorder.start();
        recorder.ondataavailable = e => recordedChunks.push(e.data);
        setTimeout(() => recorder.stop(), 30000);
        recorder.onstop = ()=>{
          const blob = new Blob(recordedChunks);
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "refuel-reading.webm";
            a.click();
        };
            
        
        
    }
</script>
</body>
</html>
